<main id="main">
    <h2 class="main__title">Зв'яжіться з нами</h2>

    <form class="contact-form" action="#" method="post">
        <div class="contact-form__item">
            <label class="contact-form__label" for="name">Ім'я</label>
            <input
                    class="contact-form__input"
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Ваше ім'я"
                    required
                    minlength="2"
                    maxlength="50"
                    pattern="^[А-Яа-яЇїІіЄєҐґA-Za-z\s\-']+$"
                    title="Ім'я може містити лише літери, апостроф або дефіс"
            >
        </div>

        <div class="contact-form__item">
            <label class="contact-form__label" for="email">Email</label>
            <input
                    class="contact-form__input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ваш email"
                    required
            >
        </div>

        <div class="contact-form__item">
            <label class="contact-form__label" for="phone">Телефон</label>
            <input
                    class="contact-form__input"
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+380XXXXXXXXX"
                    required
                    pattern="^(\+?38)?\s?0\d{2}\s?\d{3}\s?\d{2}\s?\d{2}$"
                    title="Введіть номер у форматі +380XXXXXXXXX"
            >
        </div>

        <div class="contact-form__item">
            <label class="contact-form__label" for="msg">Повідомлення</label>
            <textarea
                    class="contact-form__textarea"
                    id="msg"
                    name="msg"
                    placeholder="Ваше повідомлення"
                    rows="5"
                    required
                    minlength="10"
                    maxlength="500"
            ></textarea>
        </div>

        <button type="submit">Надіслати</button>
    </form>
